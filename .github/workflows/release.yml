name: Release Windows x64 Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Verify All E2E + Edge-Case Suites
        shell: pwsh
        run: |
          .\verify_e2e.ps1

      - name: Package Windows x64 Release Bundle
        shell: pwsh
        run: |
          $stage = "release_stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "bin\schrodinger_clip.exe", "run_observatory.ps1", "README.md", "CHANGELOG.md", "LICENSE" $stage
          $zipName = "SchrodingerClip-${{ github.ref_name }}-win64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipName -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "$hash  $zipName" | Out-File -Encoding ascii "SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            SchrodingerClip-*-win64.zip
            SHA256SUMS.txt
